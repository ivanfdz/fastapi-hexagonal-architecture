[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-hexagonal-architecture"
version = "1.0.0"
description = "A runnable hexagonal architecture example in Python: a book lending domain with no framework imports, driven by a FastAPI adapter and backed by interchangeable in-memory and SQLite adapters"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ivan Fernandez Garcia" }]
keywords = [
    "hexagonal-architecture",
    "ports-and-adapters",
    "clean-architecture",
    "domain-driven-design",
    "fastapi",
    "pydantic",
    "dependency-inversion",
    "example",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "flake8>=7.1.0",
]

[project.urls]
Homepage = "https://github.com/ivanfernandezgarcia/fastapi-hexagonal-architecture"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# ``pythonpath`` means the suite runs straight from a clone, whether or not the
# package has been installed. Useful for an example repository, and it keeps the
# tests working in environments where an editable install misbehaves.
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:lending.*"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
