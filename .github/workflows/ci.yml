name: CI

# The README claims the dependency rule "fails the build". This is the build.
# tests/test_architecture.py parses the imports of every module in the core, so a
# use case that reaches for FastAPI or a driver turns this workflow red.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, plus the next release. The suite
        # needs no services: the in-memory adapters and stdlib sqlite3 cover
        # every test, which is why this job has no `services:` block.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: flake8 src tests examples

      - name: Test
        run: pytest --cov=lending --cov-report=term-missing

      - name: Run the adapter-swapping example
        # Cheap end-to-end smoke test: it exercises both repository adapters and
        # the overdue path through a frozen clock.
        run: python examples/swap_adapters.py
